<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#1f2937"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- 40Hz text -->
  <text x="256" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="120" fill="#22c55e">40</text>
  <text x="256" y="280" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="60" fill="#4ade80">Hz</text>

  <!-- Wave visualization -->
  <path d="M80 380 Q130 340, 180 380 T280 380 T380 380 T432 380" stroke="url(#wave)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M80 420 Q130 380, 180 420 T280 420 T380 420 T432 420" stroke="#22c55e" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>
